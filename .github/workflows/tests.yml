name: Offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install namespace runtime
        run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap
      - name: Run tests with no effective capabilities or network
        run: sudo -n -- /usr/bin/python3 scripts/checks-offline.py
