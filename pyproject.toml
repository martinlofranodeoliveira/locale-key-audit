[project]
name = "locale-key-audit"
version = "0.1.0"
description = "Offline nested translation catalog key coverage reports without exposing translation values. Python API and JSON CLI."
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
locale-key-audit = "locale_key_audit.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
